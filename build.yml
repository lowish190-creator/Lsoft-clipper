name: Build Soft Clipper (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DSC_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SoftClipper-VST3-Windows
          path: build/SoftClipper_artefacts/Release/VST3/
